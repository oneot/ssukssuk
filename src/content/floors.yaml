# 센터 소개(About) — 층별 공간 3곳
#
# 왼쪽 건물 그림의 방 이름(sign)과 오른쪽 설명 카드가 모두 이 파일에서 만들어집니다.
# 공간 3곳(room: 6a, 6b, 5)의 배치와 색은 디자인에 고정되어 있어
# 항목을 더하거나 빼거나 room 값을 바꿀 수는 없습니다. 글자만 고쳐 주세요.
#
# - name: 카드 제목
# - sign: 건물 그림 속 방 이름. 줄을 바꾸면 그림에서도 그대로 줄이 바뀝니다.
# - description: 카드 본문
# - tags: 카드 아래 꼬리표 (원하는 만큼)

- room: 6a
  name: 아동청소년발달센터
  sign: |-
    아동청소년
    발달센터
  description: 발달지연, 지적·자폐성·뇌병변 장애가 있는 아동청소년의 언어, 의사소통, 감각통합, 운동기능, 인지학습 능력을 평가하고 개인별 맞춤 중재를 제공합니다.
  tags:
    - 보건복지부 지정 발달재활서비스 제공기관
    - 대전광역시교육청 치료지원

- room: 6b
  name: 움직임 스튜디오
  sign: |-
    움직임
    스튜디오
  description: 개인별 특성과 기능 수준을 고려한 적응체육과 스포츠 활동으로 움직임의 즐거움을 배우고, 몸과 마음을 이해하며 세상과 연결되는 힘을 키우는 특수체육 전문 공간입니다.
  tags:
    - 적응체육
    - 특수체육
    - 스포츠 활동

- room: 5
  name: 발달장애인 활동서비스센터
  sign: 발달장애인 활동서비스센터
  description: 개개인의 특성과 선택을 존중한 다양한 프로그램과 그룹 활동으로, 의미 있는 여가와 일상을 통해 사회 적응력과 자립 역량을 키웁니다.
  tags:
    - 보건복지부 지정 주간·방과후활동서비스 제공기관
