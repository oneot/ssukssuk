# 쑥쑥의 순간들(갤러리)
#
# 큰 화면의 콜라주는 사진 6칸으로 고정되어 있습니다. 칸마다 위치·모양·기울기가 정해져 있어서
# 칸 이름(music, horse, party, vr, simulator, digital)은 바꾸거나 더하거나 뺄 수 없습니다.
# 칸이 빠지거나, 같은 칸이 두 번 나오거나, 7번째 칸을 넣으면 사이트를 만들 때 오류가 납니다.
# 사진을 바꾸려면 각 칸의 photo·alt·caption만 고쳐 주세요. (칸 이름은 처음 넣은 사진에서 따온 것입니다.)
#
# - photo: src/assets/photos 폴더의 사진 파일 이름
# - alt: 사진을 볼 수 없는 분께 읽어 주는 설명
# - caption: 사진 위에 뜨는 이름표이자 크게 보기 화면의 설명

# 왼쪽 위 · 가로 사진(4:3) · 왼쪽으로 살짝 기울어짐
music:
  photo: music.webp
  alt: 루돌프 머리띠를 한 아이들이 우쿨렐레를 들고 마이크로 노래하는 크리스마스 발표회
  caption: 크리스마스 음악 발표회

# 왼쪽 가운데 · 세로 잎 모양(5:6)
horse:
  photo: horse.webp
  alt: 실내 승마장에서 선생님이 말을 이끌고 아이가 승마하는 모습
  caption: 실내 승마장 승마 활동

# 아래 왼쪽 · 넓은 가로 사진(16:10) · 오른쪽으로 살짝 기울어짐
party:
  photo: party.webp
  alt: 산타와 함께한 크리스마스 파티에서 아이들과 가족들이 즐거워하는 모습
  caption: 다 함께 크리스마스 파티

# 오른쪽 위 · 가로 사진(4:3) · 오른쪽으로 살짝 기울어짐
vr:
  photo: vr.webp
  alt: VR 헤드셋을 쓰고 가상 축구를 즐기며 웃는 아이
  caption: VR 스포츠 체험

# 오른쪽 가운데 · 세로 잎 모양(5:6)
simulator:
  photo: simulator.webp
  alt: 말 그림 벽화가 있는 체험실에서 선생님과 함께 승마 시뮬레이터를 타는 아이
  caption: 승마 시뮬레이터 체험실

# 아래 오른쪽 · 가로 사진(4:3) · 왼쪽으로 살짝 기울어짐
digital:
  photo: digital.webp
  alt: 레이싱 휠과 게임 패드로 화면 속 게임을 함께 즐기는 아이들
  caption: 레이싱 휠로 즐기는 디지털 놀이
